# Project
version=0.1.0
group=co.voik.agesandtheart

# Common
modName=Ages and the Art
modAuthor=Jonah Henderson
modId=agesandtheart
license=MIT
credits=
description=A Minecraft mod inspired by Mystcraft: author dimensional Ages from written Symbol pages, then link between them.

# Gradle
org.gradle.jvmargs=-Xmx3G

# The daemon is the single biggest thing standing between a change and knowing whether it worked.
# Measured 2026-07-30, running one check: 12.8s without it, 2.1s with. A bare no-op invocation went from
# 11.6s to 1.4s — that is Gradle's own JVM start and configuration, paid afresh on every single command.
# The old `false` here was not a considered choice, and running the checks one task at a time was costing
# about two minutes an iteration, nearly all of it this.
org.gradle.daemon=true

# Independent modules build at once. `common`, `fabric` and `neoforge` mostly wait on each other, so this
# is worth little today and costs nothing; it earns its keep on a clean build.
org.gradle.parallel=true

# Reuse task outputs across builds — most visible after switching branches, which the generator-parity
# check has you doing deliberately.
org.gradle.caching=true

# The configuration cache is DELIBERATELY OFF, and it is worth knowing why before turning it on.
# It works and it does help — a no-op goes 1.32s to 0.95s. But that is a third of a second against the
# daemon's ten, and Loom's and ModDevGradle's `runClient`/`runServer` tasks are the historically fragile
# ones under it. Those are the visual loop, which is the loop that matters most here. Both *configure*
# cleanly today (checked with --dry-run), so if you want the third of a second:
#     ./gradlew :common:test --configuration-cache
# and if that proves solid through a few real client runs, move it here.
# org.gradle.configuration-cache=true
