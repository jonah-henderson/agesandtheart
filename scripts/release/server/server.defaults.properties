# The beta's settings. setup.ps1 copies this to server.properties on the first start and fills in the RCON
# password; the server writes every other setting's default beside these.
motd=Ages and the Art - closed beta
white-list=true
enforce-whitelist=true
online-mode=true
max-players=10
view-distance=10
simulation-distance=8
# For backup.ps1 only, which pauses saving while it copies the world. Never forward this port.
enable-rcon=true
rcon.port=25575
rcon.password=
broadcast-rcon-to-ops=false
