# What a release bakes into the beta's bundles. Copy to .release/beta.properties and fill it in; that copy
# stays out of git, because it names the server's address.

# The multiplayer list's entry, and where Prism joins on launch.
server.name=Ages and the Art
server.address=example.invalid:25565

# Where testers report, as the tester guide says it: a channel, an email address, a form.
feedback=(where to report)

# Prism's memory for the instance, in MB. Unmeasured: watch a session and set it from that.
client.memory.min=1024
client.memory.max=4096

# The server's heap, as java -Xmx reads it.
server.memory=6G

# Pinned so a bundle rebuilds identically. Bump by hand.
prism.version=11.1.1
fabric.installer=1.1.2
