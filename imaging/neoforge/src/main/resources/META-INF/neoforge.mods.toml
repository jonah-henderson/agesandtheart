modLoader = "kotlinforforge"
loaderVersion = "${kff_version_range}"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "https://github.com/jonah-henderson/agesandtheart"
credits = "${credits}"
authors = "${mod_author}"
description = '''${description}'''

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "kotlinforforge"
type = "required"
versionRange = "${kff_version_range}"
ordering = "AFTER"
side = "BOTH"

# Ages and the Art, released with this from the same tag, so exactly its version.
[[dependencies."${mod_id}"]]
modId = "agesandtheart"
type = "required"
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"
