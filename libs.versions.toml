[versions]
java = "25"
kotlin = "2.4.0"
moddev = "2.0.147"
loom = "1.17.17"
# Dokka 2 is not optional at this Java level: 1.9.20 embeds a Kotlin compiler whose `isAtLeastJava9`
# cannot parse a "25.0.4" version string and throws, so `dokkaJavadoc` fails on Java 25 before it reads a
# line of source. 2.x is also a different plugin — see the two ids in `multiloader-common.gradle`.
dokka = "2.2.0"

minecraft = "26.2"
minecraftRange = "[26.2, 26.3)"

# NO PARCHMENT, and none is needed: Mojang removed obfuscation from Java Edition, 1.21.11 being the last
# obfuscated release and 26.1 the first unobfuscated one. There is nothing left for it to deobfuscate,
# which is also why it publishes nothing for this line.

neoforge = "26.2.0.88"
neoforgeRange = "[26.2, 26.3)"
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neoForm = "26.2-1"
kff = "6.3.0"
kffRange = "[6.3, )"

fabricLoader = "0.19.3"
fabricApi = "0.161.0+26.2"
flk = "1.13.13+kotlin.2.4.10"

mixin = "0.8.5"
mixinExtras = "0.3.5"

# Testing. Kotest brings its own JUnit Platform engine, so the platform is deliberately not versioned here
# — see the note beside the test dependencies in common/build.gradle.kts.
kotest = "6.2.3"

# Mordant — the terminal layer under the word-authoring tool. **A developer dependency and never a shipped
# one**: it sits on `common`'s `preview` source set, which the loaders never pull from, so
# `ui-libraries-research.md`'s ruling against a Kotlin UI library on NeoForge does not reach it —
# `authoring-tools.md` Part III is the note that governs here.
mordant = "3.1.0"

# Ephemeris — the runtime-dimension library, its own project at ../ephemeris. See settings.gradle.kts.
#
# **Two ranges, because the two manifests do not share a version grammar** and each rejects the other's.
# NeoForge parses Maven ranges (`[0.1.0,)`); Fabric parses its own semver predicates (`>=0.1.0`) and reads
# a Maven range as a requirement that the very version present does not satisfy — which it reports as
# "only the wrong version is present: 0.1.0". Every other range here is named by one loader only, which is
# why this is the first time it has come up.
ephemeris = "0.1.0"
ephemerisRangeNeoForge = "[0.1.0,)"
ephemerisRangeFabric = ">=0.1.0"

# NeoForge's config system, made available to Fabric — https://github.com/Fuzss/forgeconfigapiport-fabric
# Declared as a dependency rather than bundled: it is a *mod* (it hooks the loader lifecycle and wants
# Fabric API), and the ecosystem rule is that libraries are nested and mods are declared. Needed only on
# Fabric; NeoForge has the same classes built in.
forgeConfigApiPort = "26.2.1"
forgeConfigApiPortRange = ">=26.2.1"

[libraries]
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
fabricLoader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabricLoader" }
fabricApi = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabricApi" }
flk = { group = "net.fabricmc", name = "fabric-language-kotlin", version.ref = "flk" }
kff = { group = "thedarkcolour", name = "kotlinforforge-neoforge", version.ref = "kff" }
mixin = { group = "org.spongepowered", name = "mixin", version.ref = "mixin" }
mixinExtras-common = { group = "io.github.llamalad7", name = "mixinextras-common", version.ref = "mixinExtras" }

# Ephemeris. The artifact names carry the Minecraft version, which is what its `archivesName` produces —
# and what the substitutions in settings.gradle.kts have to match.
ephemeris-common = { group = "co.voik.ephemeris", name = "ephemeris-common-26.2", version.ref = "ephemeris" }
ephemeris-fabric = { group = "co.voik.ephemeris", name = "ephemeris-fabric-26.2", version.ref = "ephemeris" }
ephemeris-neoforge = { group = "co.voik.ephemeris", name = "ephemeris-neoforge-26.2", version.ref = "ephemeris" }

# The `common` artifact carries the API under its original package names, which is what lets the spec be
# written once in `common` instead of twice behind the SPI.
forgeConfigApiPort-common = { group = "fuzs.forgeconfigapiport", name = "forgeconfigapiport-common", version.ref = "forgeConfigApiPort" }
forgeConfigApiPort-fabric = { group = "fuzs.forgeconfigapiport", name = "forgeconfigapiport-fabric", version.ref = "forgeConfigApiPort" }


kotestRunner = { group = "io.kotest", name = "kotest-runner-junit5", version.ref = "kotest" }
kotestAssertions = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }
kotestProperty = { group = "io.kotest", name = "kotest-property", version.ref = "kotest" }

# The `mordant` artifact is the multiplatform umbrella; on the JVM it resolves to `mordant-jvm` and brings
# the raw-mode terminal backend with it. Java 25 means the FFM backend, so there is no native library to
# unpack and nothing to configure.
mordant = { group = "com.github.ajalt.mordant", name = "mordant", version.ref = "mordant" }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# Ships with the Kotlin compiler, so it is versioned with it rather than on its own.
powerAssert = { id = "org.jetbrains.kotlin.plugin.power-assert", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
moddev = { id = "net.neoforged.moddev", version.ref = "moddev" }
# The NON-REMAPPING Loom plugin, which is a different id from the old `fabric-loom`. Minecraft is
# unobfuscated from 26.1, so there is nothing to remap and this plugin does not try.
loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }