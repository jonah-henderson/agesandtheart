[versions]
java = "21"
kotlin = "2.4.0"
moddev = "1.0.21"
loom = "1.13.6"
dokka = "1.9.20"

minecraft = "1.21.1"
minecraftRange = "[1.21.1, 1.21.2)"

# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment = "2024.11.10"
parchmentMC = "1.21"

neoforge = "21.1.80"
neoforgeRange = "[21.1, 21.2)"
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neoForm = "1.21.1-20240808.144430"
kff = "5.12.0"
kffRange = "[5.6, )"

fabricLoader = "0.16.9"
fabricApi = "0.109.0+1.21.1"
flk = "1.13.13+kotlin.2.4.10"

mixin = "0.8.5"
mixinExtras = "0.3.5"

# Runtime dimension creation (Fabric-only) — https://github.com/NucleoidMC/fantasy
# 0.6.4+1.21 targets MC 1.21 and is ABI-compatible with our 1.21.1.
fantasy = "0.6.4+1.21"

# ANTLR, for the Art's grammar. Plain Java rather than the Kotlin-targeted `antlr-kotlin`, deliberately:
# that one needs kotlin.Pair from a stdlib which KFF supplies as a *mod*, so it lives in NeoForge's game
# module layer where an ordinary library cannot see it. This one has zero dependencies and so needs to see
# nothing. Proven in a throwaway clone before being brought here.
antlr = "4.13.2"

[libraries]
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
fabricLoader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabricLoader" }
fabricApi = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabricApi" }
flk = { group = "net.fabricmc", name = "fabric-language-kotlin", version.ref = "flk" }
kff = { group = "thedarkcolour", name = "kotlinforforge-neoforge", version.ref = "kff" }
mixin = { group = "org.spongepowered", name = "mixin", version.ref = "mixin" }
mixinExtras-common = { group = "io.github.llamalad7", name = "mixinextras-common", version.ref = "mixinExtras" }

fantasy = { group = "xyz.nucleoid", name = "fantasy", version.ref = "fantasy" }

antlrTool = { group = "org.antlr", name = "antlr4", version.ref = "antlr" }
antlrRuntime = { group = "org.antlr", name = "antlr4-runtime", version.ref = "antlr" }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
moddev = { id = "net.neoforged.moddev", version.ref = "moddev" }
loom = { id = "fabric-loom", version.ref = "loom" }